<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shankar Restaurant - Royal Indian Dining</title>
    <meta name="description" content="Authentic Indian fine dining, lightning-fast mobile ordering, royal table reservations, and geofenced kitchen verification." />
    <meta property="og:title" content="Shankar Restaurant - Royal Indian Dining" />
    <meta property="og:description" content="Authentic Indian fine dining, lightning-fast mobile ordering, royal table reservations, and geofenced kitchen verification." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Performance Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Asynchronous Non-Blocking Web Fonts with Preload and Noscript Fallback -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      />
    </noscript>

    <!-- Inlined Critical CSS for Instant Above-The-Fold First Paint (FCP / LCP) -->
    <style id="critical-above-fold-css">
      :root{--bg-cream:#faf8f5;--dark-stone:#0c0a09;--nav-stone:#1c1917;--royal-gold:#fbbf24;--stone-text:#1c1917}
      *,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
      html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
      body{background-color:var(--bg-cream);color:var(--stone-text);font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation;overflow-x:hidden;min-height:100vh}
      input,select,textarea{font-size:16px}
      @media(min-width:640px){input,select,textarea{font-size:inherit}}
      .font-serif-display{font-family:'Cinzel','Playfair Display',Georgia,serif;letter-spacing:-0.01em}
      .font-sans-body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif}
      header{position:sticky;top:0;z-index:40;background-color:rgba(28,25,23,0.95);backdrop-filter:blur(12px);border-bottom:1px solid #292524;color:#f5f5f4}
      .hero-critical{position:relative;background-color:var(--dark-stone);color:#f5f5f4;overflow:hidden}
      .hero-kicker-strip{display:flex;align-items:center;gap:0.5rem;font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--royal-gold);flex-wrap:wrap}
      .hero-h1-critical{font-family:'Cinzel','Playfair Display',serif;font-size:clamp(1.5rem,4vw,3rem);font-weight:700;color:#ffffff;line-height:1.18;letter-spacing:-0.02em}
      .cta-order-btn{background-color:var(--royal-gold);color:#0c0a09;font-weight:700;border-radius:0.75rem;padding:0.625rem 1.25rem;border:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
      .trust-strip{border-top:1px solid rgba(41,37,36,0.8);background-color:rgba(12,10,9,0.9);backdrop-filter:blur(4px)}
    </style>
  </head>
  <body class="bg-[#faf8f5] text-stone-900 antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
